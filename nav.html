<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
    <title>Shadcnblocks</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        nav {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 45px;
        }

        .menu a {
            text-decoration: none;
            color: black;
        }

        .buttons {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .buttons a {
            text-decoration: none;
            color: black;
        }

        button {
            background-color: black;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 7px;
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            ◈ Shadcnblocks.com
        </div>

        <div class="menu">
            <a href="#">Products</a>
            <a href="#">Company</a>
            <a href="#">Contact</a>
        </div>

        <div class="buttons">
            <a href="#">Log in</a>
            <button>Sign up</button>
        </div>

    </nav>

</body>
</html>
